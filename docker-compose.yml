version: '3.8'

services:
  loki:
    image: grafana/loki:latest
    container_name: loki-honeypot
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config/loki-config.yml:/etc/loki/local-config.yaml
      - loki-storage:/loki
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - TZ=Europe/Paris
    networks:
      - honeypot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/loki/api/v1/status/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-honeypot
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=ChangeMePassword123!
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_HTTPONLY=true
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Europe/Paris
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - honeypot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Service optionnel pour les métriques Prometheus
  promtail:
    image: grafana/promtail:latest
    container_name: promtail-honeypot
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - honeypot-network
    restart: unless-stopped

volumes:
  loki-storage:
    driver: local
  grafana-storage:
    driver: local

networks:
  honeypot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
